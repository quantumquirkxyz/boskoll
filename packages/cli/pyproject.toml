[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "boskoll-cli"
version = "0.1.0"
description = "CLI + TUI for software development with hyper-specialized AI agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "quantumquirkxyz" },
]
keywords = ["cli", "ai", "agents", "tui", "code-generation"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "click>=8.1",
    "rich>=13.0",
]

[project.optional-dependencies]
tui = [
    "textual>=0.40",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=4.0",
    "ruff>=0.1",
    "mypy>=1.0",
    "textual>=0.40",
]

[project.scripts]
boskoll = "boskoll_cli.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["boskoll_cli"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
